services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_user_password
      POSTGRES_DB: sandbox_db
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (not /var/lib/postgresql/data)
      - postgres-data:/var/lib/postgresql
    networks:
      - cpu-dashboard-network

  web-app:
    build: .
    working_dir: /code
    volumes:
      - .:/code
    networks:
      - cpu-dashboard-network
    environment:
      - DB_HOST=db
      - DB_USER=admin_user
      - DB_PASSWORD=admin_user_password
      - DB_NAME=sandbox_db
      - PYTHONPATH=/code
    ports:
      - "8501:8501"
    depends_on:
      - db
    command: ["streamlit", "run", "app/main.py", "--server.address=0.0.0.0", "--server.port=8501"]
  
  api:
    build: .
    working_dir: /code/api
    volumes:
      - ./api:/code/api
    networks:
      - cpu-dashboard-network
    ports:
      - "3100:3100"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=admin_user
      - DB_PASSWORD=admin_user_password
      - DB_NAME=sandbox_db
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3100"]

networks:
  cpu-dashboard-network:
    external: false # Docker Compose will create this network if it doesn't exist

volumes:
  postgres-data: